<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';"><title>ASAMB — Gestion du club</title>
<style>
:root{--belt:#15171c;--gi:#f3f4f6;--sun:#c4222c;--org:#d9831f;--grn:#2f8f5b;--line:#d9dce1}
*{box-sizing:border-box}body{margin:0;display:flex;height:100vh;overflow:hidden;font:14px 'Segoe UI',Tahoma,sans-serif;background:var(--gi);color:var(--belt)}
aside{width:250px;background:var(--belt);color:#fff;padding:16px 10px 24px;flex:none;height:100vh;overflow-y:auto}aside::-webkit-scrollbar{width:6px}aside::-webkit-scrollbar-thumb{background:#3a3e48;border-radius:3px}
aside h1{font-size:17px;margin:0 10px 22px}aside h1 b{color:var(--sun)}
.gh,.gi{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;cursor:pointer;font:inherit}
.gh{color:#e8e9ec;padding:10px;border-radius:6px;font-weight:600;font-size:13.5px}.gh:hover{background:#23262d}.gh.on{color:#fff;background:#23262d}
.gh .chev{margin-left:auto;font-size:9px;color:#8a8f99;transition:transform .15s}.gh .bg~.chev{margin-left:8px}.ng.open .chev{transform:rotate(90deg)}
.gl{display:none;margin:0 0 6px 18px;border-left:1px solid #2d3038}.ng.open .gl{display:block}
.gi{justify-content:space-between;color:#aeb2bb;padding:7px 10px 7px 12px;font-size:13px;border-radius:0 6px 6px 0}.gi:hover{background:#23262d;color:#fff}.gi.on{background:#2a2d35;color:#fff;box-shadow:inset 3px 0 0 var(--sun)}
.bg{margin-left:auto;background:var(--sun);color:#fff;border-radius:9px;font-size:11px;font-weight:600;padding:0 6px;min-width:18px;text-align:center;line-height:18px}.bc{font-size:12px;color:#7b8089;margin:-10px 0 14px}
main{flex:1;overflow:auto;padding:26px 34px}h2{margin-top:0;font-size:22px}
.cards{display:flex;gap:12px;margin-bottom:22px}.card{flex:1;background:#fff;border-left:6px solid var(--c);padding:14px 16px}.card b{font-size:30px;display:block}
table{width:100%;border-collapse:collapse;background:#fff}td,th{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left}tr.r{cursor:pointer}tr.r:hover{background:#eef0f3}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:middle}
.red{background:var(--sun)}.orange{background:var(--org)}.green{background:var(--grn)}.blue{background:#2a6fb0}
button.p{background:var(--sun);color:#fff;border:0;padding:9px 16px;border-radius:6px;cursor:pointer;font:inherit}button.s{background:#fff;border:1px solid var(--line);padding:9px 16px;border-radius:6px;cursor:pointer;font:inherit}
dialog{border:0;border-radius:8px;width:780px;max-height:92vh;padding:24px}dialog::backdrop{background:#000a}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}label{font-size:12px;color:#666;display:block;margin-bottom:2px}
input,select{width:100%;padding:7px;border:1px solid var(--line);border-radius:5px;font:inherit}input.ar{direction:rtl}
.fiche{background:#fff;padding:30px;max-width:820px}.fiche .l{border-bottom:1px solid #000;height:24px;margin-bottom:6px}.fiche .bi{display:flex;justify-content:space-between}.fiche h3{background:#e8eaed;padding:5px 9px}
.bar{height:8px;background:#e3e5e8;border-radius:4px;margin-top:8px}.bar i{display:block;height:100%;background:var(--grn);border-radius:4px}
.fi{background:#fff;padding:24px;max-width:800px;font-size:14px;line-height:2.1}.fh{display:flex;gap:14px;align-items:flex-start}.fh img{width:110px}.ft{flex:1;text-align:center;font-weight:600;line-height:1.5}.fb{border:1px solid #000;padding:6px;font-size:12px;width:175px;line-height:1.4;text-align:center}.ftitle{display:inline-block;border:2px solid #000;padding:2px 26px;margin:14px 0;font-style:italic}.v{border-bottom:1px dotted #000;padding:0 4px;min-width:40px;display:inline-block;font-weight:600}.fx{display:flex;gap:10px;margin-top:10px}.fx>div{flex:1;border:1px solid #000;padding:8px;line-height:2}.fx h3{text-align:center;background:#e8eaed;margin:0 0 6px}.fs{display:flex;justify-content:space-between;margin-top:18px;font-weight:600}.fr p{margin:2px 0;line-height:1.9}
@media print{.fi{padding:0;max-width:none}@page{size:A4;margin:12mm}}
.lt{width:100%;border-collapse:collapse;line-height:1.3}.lt th,.lt td{border:1px solid #000;padding:4px 8px}.lt th{text-align:center;background:#fff}.lt tr{page-break-inside:avoid}
.cg{display:grid;grid-template-columns:repeat(2,85.6mm);gap:4mm;justify-content:center}.kc{width:85.6mm;height:54mm;border:1px solid #000;border-radius:3mm;padding:3mm;box-sizing:border-box;background:#fff;page-break-inside:avoid;display:flex;flex-direction:column}.kh{display:flex;align-items:center;gap:6px;border-bottom:2px solid var(--sun);padding-bottom:2mm}.kh img{height:11mm}.kh span{margin-left:auto;font-size:11px}.kb{display:flex;flex:1;align-items:center;justify-content:space-between;font-size:13px;line-height:1.35}.kq svg{display:block;width:26mm;height:26mm}
.lk{background:#fff;border-radius:10px;padding:26px;width:420px;max-width:92vw;max-height:94vh;overflow:auto}.ub{margin:18px 4px 0;padding:12px 8px 0;border-top:1px solid #2d3038;color:#aeb2bb;font-size:12px;line-height:1.7}.ub b{color:#fff;font-size:13px}.ubb{background:#23262d;color:#e8e9ec;border:0;padding:5px 9px;border-radius:5px;cursor:pointer;font:inherit;font-size:12px;margin:4px 4px 0 0}.ubb:hover{background:#2f333c}
@media print{body.pk>*:not(#lock){display:none!important}body.pk #lock{position:static!important;display:block!important;background:#fff!important}}
:focus-visible{outline:2px solid var(--sun);outline-offset:1px}
@media print{aside,.no{display:none!important}main{padding:0}}
</style></head><body>
<aside><h1 style="display:flex;align-items:center;gap:10px"><img src="logo.png" alt="" style="height:38px;width:38px"><b>ASAMB</b></h1></aside>
<main id="m"></main><dialog id="dlg"></dialog><dialog id="dlg2" style="width:420px"></dialog><div id="lock" style="display:none;position:fixed;inset:0;z-index:99;background:var(--belt);align-items:center;justify-content:center"></div>
<script>
const $=s=>document.querySelector(s);
const e=s=>String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const day=n=>new Date(Date.now()+n*864e5).toISOString().slice(0,10),TODAY=day(0),LIM=day(30);
const st=d=>!d||d<TODAY?'red':d<LIM?'orange':'green',RK={green:0,orange:1,red:2};
const nz=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const hit=(a,qq)=>{const h=nz([a.nom,a.prenom,a.groupe,a.licence_no].join(' '));return nz(qq).split(/\s+/).filter(Boolean).every(w=>h.includes(w))};
const SEAS=()=>R.saisons.find(s=>s.actif==1)||R.saisons[0];
const act=a=>{const i=R.inscriptions.find(x=>x.athlete_id==a.id&&x.saison_id==SEAS().id);return !i||i.statut=='actif'};
const eff=(S,i)=>{const a=A.find(x=>x.id==i.athlete_id),d=(a&&a.date_integration)||i.date_debut||'';return d>S.debut?d:S.debut};
const started=(a,d)=>{const S=SEAS(),i=R.inscriptions.find(x=>x.athlete_id==a.id&&x.saison_id==S.id);return d>=(i?eff(S,i):(a.date_integration||S.debut))};
const MODES={annuel:1,semestriel:2,trimestriel:4,mensuel:0},FR=d=>(d||'').split('-').reverse().join('/');
function plan(S,i){const m=i.mode||'annuel',N=m=='mensuel'?(+S.nb_mois||10):MODES[m],net=Math.max(0,(+S.tarif||0)-(+i.remise||0)),base=Math.floor(net/N),L=[],st=eff(S,i),add=(d,k)=>{const x=new Date(d+'T12:00');x.setMonth(x.getMonth()+k);return x.toISOString().slice(0,10)};
 if(+S.frais>0)L.push({n:'Assurance',du:+S.frais,ech:st});
 for(let k=0;k<N;k++){const ech=add(S.debut,k*(m=='mensuel'?1:12/N));L.push({n:m=='annuel'?'Année':m=='semestriel'?'Semestre '+(k+1):m=='trimestriel'?'Trimestre '+(k+1):MOIS[+ech.slice(5,7)-1]+' '+ech.slice(0,4),du:k==N-1?net-base*(N-1):base,ech:ech<st?st:ech})}
 return L}
function alloc(S,i,paid){let r=paid;return plan(S,i).map(l=>{const p=Math.min(l.du,r);r-=p;return{...l,p,reste:l.du-p}})}
function pay(id,sid){const s=R.saisons.find(x=>x.id==(sid||SEAS().id)),i=R.inscriptions.find(x=>x.athlete_id==id&&x.saison_id==s.id&&x.statut=='actif');
 if(!i)return{ins:null};
 const paid=R.paiements.filter(x=>x.athlete_id==id&&x.saison_id==s.id&&!x.type&&!x.annule).reduce((t,x)=>t+(+x.montant||0),0),L=alloc(s,i,paid),d=L.reduce((t,l)=>t+l.du,0),late=i.delai&&i.delai>=TODAY?0:L.filter(l=>l.reste>0&&l.ech<TODAY).reduce((t,l)=>t+l.reste,0);
 return{ins:i,du:d,paid,reste:Math.max(0,d-paid),L,late,s:paid>=d?'green':late>0?'red':'blue'}}
const chk=a=>{if(!act(a))return[];const S=SEAS(),p=pay(a.id);
 const c=[['Licence',a.licence_expiration],['Certificat médical',a.certificat_expiration]].map(([l,d])=>({l,d,s:st(d)}));
 if(!p.ins)c.push({l:'Inscription '+S.nom,s:'orange',t:'à renouveler'});
 
 if(!a.groupe&&R.groupes.length)c.push({l:'Groupe',s:'orange',t:'aucun groupe attribué'});
 if(a.groupe){const z=assid(a.id);if(z.n>=4&&z.s!='green')c.push({l:'Assiduité',s:z.s,t:z.pct+' % ('+z.p+'/'+z.n+' séances)'})}
 return c};
const worst=a=>chk(a).reduce((m,x)=>RK[x.s]>RK[m]?x.s:m,'green');
const SEL={issue:['Inscrit','Réussi','Ajourné'],mode:['Espèces','Chèque','Virement / CCP'],resultat:['Inscrit','Or','Argent','Bronze','Participation'],sexe:['M','F'],ceinture:['Blanche','Jaune','Orange','Verte','Bleue','Marron','Noire']};
const DOCS=['Extrait de naissance','Fiche signalétique','Certificat médical','Autorisation parentale','Photo','Autre'];
// Pour ajouter un champ : l'ajouter ici ET dans MIGRATIONS/COLS (main.js)
const F=[['groupe','Groupe *'],['date_integration','Date d’intégration au club','date'],['nom','Nom'],['prenom','Prénom'],['date_naissance','Date de naissance','date'],['lieu_naissance','Lieu de naissance'],['sexe','Sexe'],['telephone','Téléphone'],['adresse','Adresse'],['groupe_sanguin','Groupe sanguin'],['taille','Taille (cm)'],['poids','Poids (kg)'],['profession','Profession'],['club_precedent','Club déjà fréquenté'],['profession_pere','Profession du père'],['ceinture','Ceinture'],['licence_no','N° de licence'],['licence_expiration','Licence valable jusqu’au','date'],['certificat_expiration','Certificat médical valable jusqu’au','date']];
// Modules : [colonne, libellé, type] — type 'date', '@table' (liste liée) ; les listes fixes viennent de SEL
const M={
coachs:{t:'Coachs',f:[['nom','Nom et prénom'],['telephone','Téléphone'],['diplome','Diplôme / grade']]},
groupes:{t:'Groupes et catégories',f:[['nom','Nom du groupe'],['categorie','Catégorie (âge, poids, niveau)'],['coach_id','Coach','@coachs'],['horaire','Jours et horaires']]},
paiements:{t:'Paiements',f:[['athlete_id','Athlète','@athletes'],['montant','Montant (DA)'],['date','Date du paiement','date'],['jusqua','Payé jusqu’au','date']]},
grades:{t:'Passages de grade',f:[['athlete_id','Athlète','@athletes'],['ceinture','Ceinture visée'],['date','Date de l’examen','date'],['frais','Frais de passage (DA)'],['issue','Résultat de l’examen']]},
competitions:{t:'Compétitions',f:[['nom','Nom'],['date','Date','date'],['lieu','Lieu'],['frais','Frais de participation par athlète (DA)']]},
resultats:{t:'Participants et résultats',f:[['competition_id','Compétition','@competitions'],['athlete_id','Athlète','@athletes'],['resultat','Résultat'],['frais','Frais (DA) — vide = tarif de la compétition']]}};
M.saisons={t:'Saisons',f:[['nom','Nom de la saison'],['debut','Date d’ouverture de la saison','date'],['fin','Fin','date'],['frais','Assurance (DA)'],['tarif','Cotisation annuelle (DA)'],['frais_grade','Frais de passage de grade (DA)'],['nb_mois','Nombre de mois de cotisation (formule mensuelle)']]};M.inscriptions={t:'Inscriptions',f:[]};M.creneaux={t:'Créneaux',f:[]};M.presences={t:'Présences',f:[]};M.presences_coachs={t:'Présences coachs',f:[]};M.annulations={t:'Annulations',f:[]};M.relances={t:'Relances',f:[]};M.grades.def=()=>({date:TODAY,frais:SEAS().frais_grade,issue:'Inscrit'});
const NAVG=[
 {k:'accueil',i:'🏠',t:'Tableau de bord',items:[['dash','Tableau de bord']]},
 {k:'ath',i:'👥',t:'Athlètes',items:[['ath','Liste des athlètes'],['dossiers','Dossiers d’inscription'],['fiche','Fiche d’inscription'],['cartes','Cartes QR']]},
 {k:'ent',i:'🥋',t:'Entraînements',items:[['groupes','Groupes et séances'],['coachs','Coachs'],['pres','Présences'],['pointage','Pointage QR']]},
 {k:'fin',i:'💰',t:'Finances',items:[['paiements','Paiements'],['assurance','Assurance'],['caisse','Caisse et rapports'],['relances','Relances']]},
 {k:'comp',i:'🏆',t:'Grades et compétitions',items:[['grades','Passages de grade'],['competitions','Compétitions'],['resultats','Participants aux compétitions']]},
 {k:'com',i:'💬',t:'Annonces WhatsApp',items:[['annonces','Annonces WhatsApp']]},
 {k:'adm',i:'⚙️',t:'Administration',items:[['saisons','Saisons'],['parametres','Paramètres'],['utilisateurs','Utilisateurs'],['journal','Journal des actions'],['imp','Import / Export']]}];
const NAV=NAVG.flatMap(g=>g.items),PARENT={cartesprint:'cartes',assurlist:'assurance',recu:'paiements'};
let A=[],R={},cur='dash',PS=null,PF='',RECU=0,PT='cot';
const nm=(t,id)=>{const x=(t=='athletes'?A:R[t]).find(y=>y.id==id);return x?e(x.nom+(x.prenom?' '+x.prenom:'')):'—'};
const lab=(t,v)=>t&&t[0]=='@'?nm(t.slice(1),v):e(v);
const V={
utilisateurs(){return `<h2>Utilisateurs</h2><p>Chaque personne se connecte avec son identifiant. Rôles : <b>Président</b> (tout), <b>Trésorier</b> (finances), <b>Secrétaire</b> (athlètes, dossiers, groupes, annonces), <b>Coach</b> (présences et pointage).</p><p><button class="p" onclick="usrEdit(0)">Ajouter un utilisateur</button></p><table id="utb"></table>`},
journal(){return `<h2>Journal des actions</h2><p class="no">Du <input type="date" id="jd1" value="${day(-7)}" style="width:auto"> au <input type="date" id="jd2" value="${TODAY}" style="width:auto"> &nbsp;Utilisateur <input id="ju" style="width:140px"> Recherche <input id="jt" style="width:160px"> <button class="p" onclick="jrn_t()">Afficher</button> <button class="s" onclick="jrnExport()">Exporter en Excel</button> <button class="s" onclick="print()">Imprimer</button></p><table class="lt" id="jtb"></table>`},
annonces(){return `<h2>Annonces WhatsApp</h2><p>ASAMB prépare le message ; vous l’envoyez depuis WhatsApp (Desktop ou Web, connecté au téléphone du club). Aucun envoi automatique.</p><div class="g"><div><label>Modèle</label><select id="an_m" onchange="an_fill()"><option value="libre">Message libre</option><option value="annulation">Annulation de séance</option><option value="exception">Séance exceptionnelle / changement</option><option value="paiement">Rappel général de cotisation</option></select></div><div><label>Groupe concerné</label><select id="an_g" onchange="an_fill()"><option value="">Tous les groupes</option>${R.groupes.map(g=>`<option value="${g.id}">${e(g.nom)}</option>`).join('')}</select></div><div><label>Date</label><input type="date" id="an_d" value="${TODAY}" onchange="an_fill()"></div></div><p><label>Motif / précision (facultatif)</label><input id="an_p" oninput="an_fill()"></p><p><label>Message</label><textarea id="an_t" rows="5" style="width:100%;padding:7px;border:1px solid var(--line);border-radius:5px;font:inherit"></textarea></p><p><button class="p" onclick="anGroupe()">Copier et ouvrir le groupe WhatsApp</button> <button class="s" onclick="anInd()">Envoyer individuellement aux parents…</button></p><div id="an_l"></div><h3>Dernières annonces</h3><table id="an_h"></table>`},
relances(){return `<h2>Relances des impayés</h2><p>Modèle du message (modifiable ; enregistré sur ce PC). Variables : {athlete} {saison} {montant} {objets}</p><textarea rows="3" style="width:100%;padding:7px;border:1px solid var(--line);border-radius:5px;font:inherit" onchange="localStorage.setItem('relance_tpl',this.value);rel_t()">${e(localStorage.getItem('relance_tpl')||RTPL)}</textarea><table id="rtb"></table>`},
cartes(){return `<h2>Cartes d’athlète (QR code)</h2><p>Cartes au format carte bancaire (85,6 × 54 mm), 8 par page A4. Le code QR sert au pointage des présences.</p><p><select onchange="CG=this.value;ct_t()" style="width:auto"><option value="">Tous les groupes</option>${R.groupes.map(g=>`<option ${g.nom==CG?'selected':''}>${e(g.nom)}</option>`).join('')}</select> <button class="s" onclick="document.querySelectorAll('.cc').forEach(c=>c.checked=true)">Tout cocher</button> <button class="s" onclick="document.querySelectorAll('.cc').forEach(c=>c.checked=false)">Tout décocher</button> <button class="p" onclick="ctPrint()">Imprimer les cartes cochées</button></p><table id="ctb"></table>`},
cartesprint(){const S=SEAS(),L=AL.map(id=>A.find(a=>a.id==id)).filter(Boolean);return `<p class="no"><button class="p" onclick="print()">Imprimer</button> <button class="s" onclick="show('cartes')">Retour</button> ${L.length} carte(s)</p><div class="cg">${L.map(a=>`<div class="kc"><div class="kh"><img src="${e(PARAM.logo||'logo.png')}" alt=""><b>ASAMB</b><span>Saison ${e(S.nom)}</span></div><div class="kb"><div><b>${e(a.nom)}</b><br>${e(a.prenom)}<br><small>Né(e) le ${FR(a.date_naissance)}</small><br><small>Groupe : ${e(a.groupe)}</small><br><small>Licence : ${e(a.licence_no)}</small></div><div class="kq">${QR.svg('ASAMB:'+a.id)}</div></div></div>`).join('')}</div>`},
pointage(){if(!R.groupes.length)return '<h2>Pointage</h2><p>Créez d’abord un groupe.</p>';const ts=sessOn(TODAY).map(s=>s.g.id);if(!R.groupes.find(g=>g.id==PTG))PTG=(R.groupes.find(g=>ts.includes(g.id))||R.groupes[0]).id;
 return `<h2>Pointage par QR code — ${FR(TODAY)}</h2><p><select onchange="PTG=+this.value;pt2()" style="width:auto">${R.groupes.map(g=>`<option value="${g.id}" ${g.id==PTG?'selected':''}>${e(g.nom)}${ts.includes(g.id)?' (séance aujourd’hui)':''}</option>`).join('')}</select> Scannez la carte : <input id="qs" autocomplete="off" placeholder="Scanner ici (ou saisir ASAMB:n°)" onkeydown="if(event.key=='Enter'){ptScan(this.value);this.value=''}" onblur="setTimeout(()=>{if(cur=='pointage'&&!$('#dlg').open&&!$('#dlg2').open)$('#qs').focus()},80)" style="width:320px"></p><p id="qm" style="font-weight:700;min-height:1.6em"></p><div id="qt"></div>`},
caisse(){return `<h2>Journal de caisse et rapports</h2><p class="no">Du <input type="date" value="${CA.d1}" onchange="CA.d1=this.value||TODAY;ca_t()" style="width:auto"> au <input type="date" value="${CA.d2}" onchange="CA.d2=this.value||TODAY;ca_t()" style="width:auto"> &nbsp; <button class="s" onclick="caQ('j')">Aujourd’hui</button> <button class="s" onclick="caQ('m')">Ce mois</button> <button class="s" onclick="caQ('p')">Mois précédent</button> &nbsp; <button class="p" onclick="print()">Imprimer</button> <button class="s" onclick="caExport()">Exporter en Excel</button></p><div id="cab" class="fi" style="max-width:none"></div>`},
dossiers(){return `<h2>Dossiers d’inscription — saison ${e(SEAS().nom)}</h2><div id="dc"></div><p><select onchange="DF=this.value;dos_t()" style="width:auto"><option value="">Tous</option><option value="compl" ${DF=='compl'?'selected':''}>À compléter</option><option value="verif" ${DF=='verif'?'selected':''}>À vérifier</option><option value="valide" ${DF=='valide'?'selected':''}>Validés</option><option value="rejete" ${DF=='rejete'?'selected':''}>Rejetés</option></select> <input id="dq" placeholder="Rechercher (nom, prénom, groupe)" oninput="dos_t()" style="width:260px"></p><table id="dtb"></table>`},
assurance(){PS=PS||SEAS().id;const S=R.saisons.find(s=>s.id==PS);

 $('#qt').innerHTML=`<p>${z.mem.filter(a=>P.some(x=>x.athlete_id==a.id&&x.present==1)).length} présent(s) sur ${z.mem.length}${z.an?' — <b style="color:var(--sun)">séance annulée aujourd’hui</b>':''}</p><table>${z.mem.map(a=>{const p=P.find(x=>x.athlete_id==a.id);return `<tr><td>${e(a.nom)} ${e(a.prenom)}</td><td>${p?(p.present==1?'<i class="dot green"></i>Présent':'<i class="dot red"></i>Absent'):'<i class="dot orange"></i>En attente'}</td></tr>`}).join('')}</table><p><button class="p" onclick="ptClose()">Clôturer le pointage (les non scannés = absents)</button></p>`}
async function ptScan(v){const m=/^ASAMB:(\d+)$/i.exec(String(v).trim()),G=R.groupes.find(g=>g.id==PTG);if(!m)return qmsg('Code non reconnu : '+v,false);
 const a=A.find(x=>x.id==+m[1]);if(!a)return qmsg('Athlète introuvable (carte d’une autre base ?)',false);if(ss(G,TODAY).an)return qmsg('Séance annulée aujourd’hui pour ce groupe.',false);
 if(a.groupe!=G.nom)return qmsg(a.nom+' '+a.prenom+' appartient au groupe « '+(a.groupe||'aucun')+' », pas à « '+G.nom+' ».',false);
 await api.call('pres:save',TODAY,[[a.id,1]]);R.presences=R.presences.filter(x=>!(x.athlete_id==a.id&&x.date==TODAY));R.presences.push({athlete_id:a.id,date:TODAY,present:1});qmsg('✔ '+a.nom+' '+a.prenom+' — présent',true);pt2()}
async function ptClose(){const G=R.groupes.find(g=>g.id==PTG),z=ss(G,TODAY),P=R.presences.filter(x=>x.date==TODAY),w=z.mem.filter(a=>!P.some(x=>x.athlete_id==a.id));if(!confirm('Clôturer le pointage de « '+G.nom+' » ? '+w.length+' athlète(s) non scanné(s) seront marqués absents.'))return;if(w.length)await api.call('pres:save',TODAY,w.map(a=>[a.id,0]));await load()}

const copier=t=>(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).catch(()=>{const x=document.createElement('textarea');x.value=t;document.body.append(x);x.select();document.execCommand('copy');x.remove()});
function todayBlock(){const L=sessOn(TODAY);return `<h3>Séances d’aujourd’hui — ${FR(TODAY)}</h3><table>${L.map(s=>`<tr><td>${s.heures}</td><td><b>${e(s.g.nom)}</b></td><td>${etat(s)}</td><td style="text-align:right">${btns(s)}</td></tr>`).join('')||'<tr><td>Aucune séance prévue aujourd’hui.</td></tr>'}</table>`}
function an_fill(){const m=$('#an_m').value,gid=+$('#an_g').value,G=R.groupes.find(g=>g.id==gid),d=$('#an_d').value||TODAY,p=$('#an_p').value.trim(),jr=JN[new Date(d+'T12:00').getDay()]+' '+FR(d),hs=G?sessOn(d).filter(s=>s.g.id==G.id).map(s=>s.heures).join(', '):'',gt=G?'du groupe « '+G.nom+' »':'';
 const T={annulation:`ASAMB — La séance ${gt?gt+' ':''}du ${jr}${hs?' ('+hs+')':''} est annulée${p?' : '+p:''}. Nous vous informerons de la reprise. Merci de votre compréhension.`,exception:`ASAMB — Séance exceptionnelle ${gt?gt+' ':''}le ${jr}${hs?' ('+hs+')':''}${p?' : '+p:''}.`,paiement:`ASAMB — Rappel : la cotisation de la saison ${SEAS().nom} est à régler au club. Pour toute question : ${PARAM.telephone1||''}.`};if(T[m])$('#an_t').value=T[m]}
function an_t(){if(ANN.m){$('#an_m').value=ANN.m;$('#an_g').value=ANN.g||'';$('#an_d').value=ANN.d||TODAY;$('#an_p').value=ANN.p||'';ANN={};an_fill()}
 $('#an_h').innerHTML='<tr><th>Date</th><th>Canal</th><th>Message</th></tr>'+(R.relances.filter(x=>String(x.canal||'').startsWith('Annonce')&&!x.athlete_id).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||b.id-a.id).slice(0,10).map(x=>`<tr><td>${FR(x.date)}</td><td>${e(x.canal)}</td><td><small>${e(x.message)}</small></td></tr>`).join('')||'<tr><td colspan="3">Aucune annonce envoyée.</td></tr>')}
async function anGroupe(){const t=$('#an_t').value.trim();if(!t)return alert('Rédigez d’abord le message.');const G=R.groupes.find(g=>g.id==+$('#an_g').value),lien=(G&&G.lien_whatsapp)||PARAM.whatsapp_groupe;await copier(t);
 if(!lien)return alert('Message copié, mais aucun lien de groupe WhatsApp n’est configuré (Paramètres, ou fiche du groupe). Ouvrez le groupe dans WhatsApp et collez le message.');
 if(await api.call('lien:ouvrir',lien)){await api.call('row:save','relances',{athlete_id:null,date:TODAY,canal:G&&G.lien_whatsapp?'Annonce groupe « '+G.nom+' »':'Annonce groupe général',message:t});alert('Message copié et groupe ouvert : collez-le (Ctrl+V) dans WhatsApp puis envoyez.');await load()}else alert('Lien du groupe non valide : vérifiez-le (Paramètres ou fiche du groupe).')}
function anInd(){if(!$('#an_t').value.trim())return alert('Rédigez d’abord le message.');const G=R.groupes.find(g=>g.id==+$('#an_g').value),L=A.filter(a=>act(a)&&(!G||a.groupe==G.nom)).sort((x,y)=>(x.nom+x.prenom).localeCompare(y.nom+y.prenom));
 $('#an_l').innerHTML=`<h3>Envoi individuel — ${L.length} athlète(s)${G?' du groupe « '+e(G.nom)+' »':''}</h3><table>${L.map(a=>`<tr><td>${e(a.nom)} ${e(a.prenom)}</td><td>${tel(a.telephone)?e(a.telephone):'<span style="color:var(--sun)">numéro manquant</span>'}</td><td style="text-align:right" id="anr${a.id}">${tel(a.telephone)?`<button class="s" onclick="anOne(${a.id})">WhatsApp</button>`:''}</td></tr>`).join('')}</table>`}
async function anOne(id){const a=A.find(x=>x.id==id),t=$('#an_t').value.trim().replace(/\{athlete\}/g,a.nom+' '+a.prenom);if(await api.call('lien:ouvrir','https://wa.me/'+tel(a.telephone)+'?text='+encodeURIComponent(t))){$('#anr'+id).innerHTML='<b style="color:var(--grn)">✔ ouvert</b>';await api.call('row:save','relances',{athlete_id:id,date:TODAY,canal:'Annonce WhatsApp',message:t})}}


let USER=null,UL=[],JL=[],idleT=null,idleOn=false;
const ROLE_LAB={president:'Président',tresorier:'Trésorier',secretaire:'Secrétaire',coach:'Coach'};
const VUES={president:'*',tresorier:['dash','ath','paiements','assurance','caisse','relances','saisons','recu','assurlist'],secretaire:['dash','ath','dossiers','fiche','cartes','cartesprint','groupes','coachs','pres','pointage','grades','competitions','resultats','annonces','assurance','assurlist','saisons','imp'],coach:['dash','ath','groupes','pres','pointage']};
const can=v=>!!USER&&(VUES[USER.role]=='*'||VUES[USER.role].includes(v));
const errMsg=x=>String(x&&x.message||x).replace(/^Error invoking remote method '[^']*': (Error: )?/,'');
function lockUI(h){const l=$('#lock');l.style.display='flex';l.innerHTML=`<div class="lk"><div style="text-align:center;margin-bottom:10px"><img src="logo.png" alt="" style="height:64px"><h2 style="margin:6px 0 0">ASAMB</h2></div>${h}</div>`}
const unlockHide=()=>{$('#lock').style.display='none';$('#lock').innerHTML=''};
function unlock(){unlockHide();idleStart();load()}
function lockLogin(msg){lockUI(`<h3>Connexion</h3><p><label>Identifiant</label><input id="lg_i" autocomplete="username"></p><p><label>Mot de passe</label><input id="lg_p" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')doLogin()"></p><p id="lg_m" style="color:var(--sun);min-height:1.3em">${e(msg||'')}</p><p><button class="p" onclick="doLogin()" style="width:100%">Se connecter</button></p><p style="text-align:center"><a href="#" onclick="lockRecup();return false">Mot de passe oublié ?</a></p>`);$('#lg_i').focus()}
async function doLogin(){const r=await api.call('auth:login',$('#lg_i').value,$('#lg_p').value);if(!r.ok){$('#lg_m').textContent=r.erreur;$('#lg_p').value='';return}USER=r.utilisateur;if(USER.doit_changer)return chPwd(true);unlock()}
function lockSetup(){lockUI(`<h3>Première utilisation</h3><p>Créez le compte du <b>président</b> (administrateur du logiciel).</p><p><label>Nom complet</label><input id="su_n"></p><p><label>Identifiant (3 caractères minimum, sans espace)</label><input id="su_i" autocomplete="username"></p><p><label>Mot de passe (8 caractères minimum)</label><input id="su_p" type="password" autocomplete="new-password"></p><p><label>Confirmer le mot de passe</label><input id="su_c" type="password" autocomplete="new-password"></p><p id="su_m" style="color:var(--sun);min-height:1.3em"></p><p><button class="p" onclick="doSetup()" style="width:100%">Créer le compte</button></p>`)}
async function doSetup(){const p=$('#su_p').value;if(p!==$('#su_c').value)return $('#su_m').textContent='Les mots de passe ne correspondent pas.';try{const r=await api.call('auth:setup',$('#su_n').value,$('#su_i').value,p);USER=r.utilisateur;lockKey(r.cle,'Continuer',"if($('#kk').checked)unlock();else alert('Cochez la case pour confirmer.')")}catch(x){$('#su_m').textContent=errMsg(x)}}
function lockKey(cle,btn,action){lockUI(`<h3>Clé de récupération</h3><p>Notez cette clé et conservez-la en lieu sûr (coffre du club). C’est <b>la seule façon</b> de récupérer le compte président si le mot de passe est oublié. Elle ne sera plus affichée.</p><p style="font:700 21px monospace;text-align:center;letter-spacing:2px;border:2px dashed #999;padding:12px">${cle}</p><p><button class="s" onclick="document.body.classList.add('pk');print();document.body.classList.remove('pk')">Imprimer la clé</button></p><p><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="kk" style="width:auto"> J’ai noté la clé de récupération</label></p><p><button class="p" onclick="${action}" style="width:100%">${btn}</button></p>`)}
function lockRecup(){lockUI(`<h3>Récupération du compte président</h3><p>Saisissez la clé de récupération remise lors de la première utilisation.</p><p><label>Clé de récupération</label><input id="rc_k" placeholder="XXXX-XXXX-XXXX-XXXX"></p><p><label>Nouveau mot de passe (8 caractères minimum)</label><input id="rc_p" type="password"></p><p id="rc_m" style="color:var(--sun);min-height:1.3em"></p><p><button class="p" onclick="doRecup()">Réinitialiser</button> <a href="#" onclick="lockLogin();return false" style="margin-left:10px">Retour</a></p>`)}
async function doRecup(){try{const r=await api.call('auth:recuperer',$('#rc_k').value,$('#rc_p').value);if(!r.ok)return $('#rc_m').textContent=r.erreur;lockKey(r.cle,'Aller à la connexion',"if($('#kk').checked)lockLogin('Connectez-vous avec l’identifiant « "+r.identifiant+" » : vous choisirez un nouveau mot de passe.');else alert('Cochez la case pour confirmer.')")}catch(x){$('#rc_m').textContent=errMsg(x)}}
function chPwd(forced){lockUI(`<h3>${forced?'Choisissez votre mot de passe':'Changer mon mot de passe'}</h3>${forced?'<p>Votre mot de passe est provisoire : définissez-en un nouveau pour continuer.</p>':''}<p><label>Mot de passe actuel</label><input id="cp_a" type="password"></p><p><label>Nouveau mot de passe (8 caractères minimum)</label><input id="cp_n" type="password"></p><p><label>Confirmer le nouveau mot de passe</label><input id="cp_c" type="password"></p><p id="cp_m" style="color:var(--sun);min-height:1.3em"></p><p><button class="p" onclick="doChPwd(${!!forced})">Enregistrer</button> ${forced?'':'<button class="s" onclick="unlockHide()">Annuler</button>'}</p>`)}
async function doChPwd(forced){if($('#cp_n').value!==$('#cp_c').value)return $('#cp_m').textContent='Les deux nouveaux mots de passe ne correspondent pas.';try{await api.call('auth:changer',$('#cp_a').value,$('#cp_n').value);USER.doit_changer=0;if(forced)unlock();else{unlockHide();alert('Mot de passe modifié.')}}catch(x){$('#cp_m').textContent=errMsg(x)}}
async function logout(){try{await api.call('auth:logout')}catch(x){}USER=null;R={};A=[];$('#m').innerHTML='';document.querySelector('aside').innerHTML='';lockLogin()}
function idleReset(){clearTimeout(idleT);idleT=setTimeout(()=>{if(USER)logout()},15*60*1000)}
function idleStart(){if(!idleOn){idleOn=true;['mousemove','keydown','click'].forEach(ev=>document.addEventListener(ev,()=>{if(USER)idleReset()}))}idleReset()}
async function boot(){try{const s=await api.call('auth:etat');if(s.connecte){USER=s.utilisateur;if(USER.doit_changer)return chPwd(true);unlock()}else if(s.aucun)lockSetup();else lockLogin()}catch(x){document.body.innerHTML='<p style="padding:24px">API Electron indisponible. Vérifiez preload.js.</p>'}}
window.addEventListener('unhandledrejection',ev=>{const m=String(ev.reason&&ev.reason.message||ev.reason||'');if(/Non connecté/.test(m)){ev.preventDefault();USER=null;lockLogin('Session expirée : reconnectez-vous.')}else if(/Accès refusé/.test(m)){ev.preventDefault();alert('Action non autorisée pour votre rôle.')}});
async function usr_t(){UL=await api.call('usr:list');$('#utb').innerHTML='<tr><th>Nom</th><th>Identifiant</th><th>Rôle</th><th>État</th><th></th></tr>'+UL.map(u=>`<tr><td>${e(u.nom)}</td><td>${e(u.identifiant)}</td><td>${ROLE_LAB[u.role]}</td><td>${u.actif?'Actif':'<span style="color:var(--sun)">Désactivé</span>'}${u.doit_changer?'<br><small>doit changer son mot de passe</small>':''}</td><td style="text-align:right"><button class="s" onclick="usrEdit(${u.id})">Modifier</button> <button class="s" onclick="usrReset(${u.id})">Réinitialiser le mot de passe</button></td></tr>`).join('')}
function usrEdit(id){const u=UL.find(x=>x.id==id)||{role:'coach',actif:1};$('#dlg').innerHTML=`<h3>${id?'Modifier l’utilisateur':'Nouvel utilisateur'}</h3><div class="g"><div><label>Nom complet</label><input id="u_n" value="${e(u.nom)}"></div><div><label>Identifiant</label><input id="u_i" value="${e(u.identifiant)}" ${id?'disabled':''}></div><div><label>Rôle</label><select id="u_r">${Object.entries(ROLE_LAB).map(([k,l])=>`<option value="${k}" ${u.role==k?'selected':''}>${l}</option>`).join('')}</select></div></div>${id?`<p><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="u_a" style="width:auto" ${u.actif?'checked':''}> Compte actif</label></p>`:`<p><label>Mot de passe provisoire (8 caractères minimum ; à changer à la première connexion)</label><input id="u_p"></p>`}<p style="text-align:right"><button class="s" onclick="$('#dlg').close()">Fermer</button> <button class="p" onclick="usrSave(${id})">Enregistrer</button></p>`;$('#dlg').showModal()}
async function usrSave(id){try{await api.call('usr:save',{id:id||null,nom:$('#u_n').value,identifiant:$('#u_i').value,role:$('#u_r').value,actif:id?$('#u_a').checked:true,motdepasse:id?null:$('#u_p').value});$('#dlg').close();usr_t()}catch(x){alert(errMsg(x))}}
function usrReset(id){ask('Nouveau mot de passe provisoire (8 caractères minimum)',async p=>{try{await api.call('usr:reset',id,p);alert('Mot de passe réinitialisé : l’utilisateur devra le changer à sa prochaine connexion.');usr_t()}catch(x){alert(errMsg(x))}})}
async function jrn_t(){JL=await api.call('jrn:list',{du:$('#jd1').value,au:$('#jd2').value,utilisateur:$('#ju').value,texte:$('#jt').value});$('#jtb').innerHTML='<thead><tr><th>Date et heure</th><th>Utilisateur</th><th>Action</th><th>Détail</th></tr></thead><tbody>'+(JL.map(x=>`<tr><td>${new Date(x.horodatage).toLocaleString('fr-FR')}</td><td>${e(x.utilisateur)}${x.role?' ('+(ROLE_LAB[x.role]||x.role)+')':''}</td><td>${e(x.action)}</td><td><small>${e(x.detail)}</small></td></tr>`).join('')||'<tr><td colspan="4">Aucune action sur cette période.</td></tr>')+'</tbody>'}
function jrnExport(){if(!JL.length)return alert('Rien à exporter.');api.call('list:export','journal_actions.xlsx',['DATE ET HEURE','UTILISATEUR','ROLE','ACTION','DETAIL'],JL.map(x=>[new Date(x.horodatage).toLocaleString('fr-FR'),x.utilisateur,x.role||'',x.action,x.detail||'']))}
let NAVOPEN=new Set(JSON.parse(localStorage.getItem('nav_open')||'["accueil","ath"]'));
const navSave=()=>localStorage.setItem('nav_open',JSON.stringify([...NAVOPEN]));
function navT(k){NAVOPEN.has(k)?NAVOPEN.delete(k):NAVOPEN.add(k);navSave();navRender()}
function crumb(v){const p=PARENT[v]||v,g=NAVG.find(x=>x.items.some(i=>i[0]==p));if(!g||g.items.length==1)return '';return `<div class="bc no">${g.i} ${g.t} › ${g.items.find(i=>i[0]==p)[1]}</div>`}
function badges(){const b={};try{if(can('dossiers'))b.dossiers=dosRows().filter(x=>x.d.statut=='compl'||x.d.statut=='verif').length;if(can('pres'))b.pres=miss().length;if(can('relances'))b.relances=relRows().length;if(can('assurance'))b.assurance=asRows().filter(x=>!x.z.cot).length}catch(x){}return b}
function navRender(){if(!USER)return;const pv=PARENT[cur]||cur,bd=badges();
 document.querySelector('aside').innerHTML=`<h1 style="display:flex;align-items:center;gap:10px;margin:2px 8px 16px"><img src="${e(PARAM.logo||'logo.png')}" alt="" style="height:38px;width:38px"><b>ASAMB</b></h1>`+NAVG.map(g=>{const its=g.items.filter(i=>can(i[0]));if(!its.length)return '';
  if(g.items.length==1){const k=its[0][0];return `<button class="gh ${pv==k?'on':''}" onclick="show('${k}')"><span>${g.i}</span>${g.t}</button>`}
  const open=NAVOPEN.has(g.k),sum=its.reduce((t,i)=>t+(bd[i[0]]||0),0);
  return `<div class="ng ${open?'open':''}"><button class="gh ${its.some(i=>i[0]==pv)?'on':''}" onclick="navT('${g.k}')"><span>${g.i}</span>${g.t}${!open&&sum?`<span class="bg">${sum}</span>`:''}<span class="chev">▶</span></button><div class="gl">${its.map(([k,l])=>`<button class="gi ${pv==k?'on':''}" onclick="show('${k}')">${l}${bd[k]?`<span class="bg">${bd[k]}</span>`:''}</button>`).join('')}</div></div>`}).join('')+`<div class="ub"><b>${e(USER.nom)}</b><br>${ROLE_LAB[USER.role]}<br><button class="ubb" onclick="chPwd(false)">Mon mot de passe</button><button class="ubb" onclick="logout()">Déconnexion</button></div>`}
boot();
</script></body></html>
